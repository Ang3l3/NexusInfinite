<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% 40%, rgba(91,105,255,.16), transparent 55%), #030509;
    color: #f4f6ff;
    font-family: 'Sora', 'Segoe UI', sans-serif;
    text-align: center;
}
p {
    max-width: 900px;
    font-size: clamp(1.35rem, 4vw, 2.8rem);
    line-height: 1.5;
    font-weight: 600;
    letter-spacing: .01em;
    text-wrap: balance;
    text-shadow: 0 0 24px rgba(130,150,255,.22);
    animation: appear 900ms ease both;
}
@keyframes appear {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
    p { animation: none; }
}
</style>
</head>
<body>
<p>About us? Ok la, ginbuligan ko hiya i-ship ha iba. 🥺</p>
</body>
</html>
