
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexus Infinite</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="services.css">

</head>


<body>

<main class="hero">

    <!-- BRAND LOGO -->

    <a href="index.html" class="brand">

        <img src="logo.png" alt="Nexus Infinite Logo">

        <span class="brand-name">
            NEXUS INFINITE
        </span>

    </a>


    <!-- HERO TEXT -->

    <section class="hero-copy">

        <p class="eyebrow">
            WELCOME TO THE NEXUS EXPERIENCE
        </p>

        <h1>

            <span class="title-small">
                CHOOSE YOUR
            </span>

            <span class="title-main">
                NEXUS.
            </span>

        </h1>

        <p class="subtitle">
            Choose your setup. Enter your next experience.
        </p>

    </section>


    <!-- FLOOR LIGHTING -->

    <div class="floor-glow console-glow"></div>

    <div class="floor-glow mobile-glow"></div>

    <div class="floor-glow laptop-glow"></div>

    <div class="floor-line"></div>


    <!-- THREE PRODUCT SELECTIONS -->

    <section class="product-stage">


        <!-- 01 GAMING -->

        <a href="forge.html"
           class="product-link console-link"
           aria-label="Explore gaming">

            <img
                src="icon2.png"
                alt="Gaming console and controller"
            >

            <div class="product-info">

                <span class="product-category">
                    01 / GAMING
                </span>

                <span class="product-name">
                    FORGE
                </span>

                <span class="product-description">
                    EXPLORE COMPETITIVE GAMING
                </span>

            </div>

        </a>



        <!-- 02 MOBILE GAMING -->

        <a href="mobileforge.html"
           class="product-link mobile-link"
           aria-label="Explore mobile gaming">

            <img
                src="icon3.png"
                alt="Mobile gaming setup"
            >

            <div class="product-info">

                <span class="product-category">
                    02 / MOBILE
                </span>

                <span class="product-name">
                    MOBILE FORGE
                </span>

                <span class="product-description">
                    EXPLORE MOBILE GAMING
                </span>

            </div>

        </a>



        <!-- 03 COMPUTING -->

        <a href="focus.html"
           class="product-link laptop-link"
           aria-label="Explore productivity">

            <img
                src="icon1.png"
                alt="Laptop workstation"
            >

            <div class="product-info">

                <span class="product-category">
                    03 / COMPUTING
                </span>

                <span class="product-name">
                    FOCUS
                </span>

                <span class="product-description">
                    EXPLORE PRODUCTIVITY
                </span>

            </div>

        </a>


    </section>


    <!-- BOTTOM TEXT -->

    <div class="bottom-note">

        SELECT AN EXPERIENCE TO CONTINUE

    </div>


</main>

</body>
</html>
